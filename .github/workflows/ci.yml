name: CI
on: [push]
jobs:
    build-test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-version: ['8.3', '8.4', '8.5', '8.6']

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .env
              run: cp .env.example .env

            - name: Setup ownership
              run: git config --global --add safe.directory /app

            - name: Replace placeholders with GitHub Secrets
              run: |
                sed -i "s/BLUEM_SENDER_ID=S/BLUEM_SENDER_ID=${{ secrets.BLUEM_SENDER_ID }}/g" .env
                sed -i "s/BLUEM_TEST_ACCESS_TOKEN=/BLUEM_TEST_ACCESS_TOKEN=${{ secrets.BLUEM_TEST_ACCESS_TOKEN }}/g" .env

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl
                  coverage: xdebug

            - name: Run composer
              uses: php-actions/composer@v6
              with:
                  php_version: ${{ matrix.php-version }}

            - name: PHPCS Lint
              run: make lint

            - name: PHPUnit Tests
              uses: php-actions/phpunit@v4
              with:
                  php_version: ${{ matrix.php-version }}
                  version: 12
                  bootstrap: ./vendor/autoload.php
                  configuration: ./.github/workflows/phpunit.xml

    resolve-php-8-6-dependencies:
        name: Resolve dependencies for PHP 8.6
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP 8.6
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.6'
                  extensions: mbstring, intl

            - name: Resolve dependencies against PHP 8.6
              run: |
                  composer config platform.php 8.6.0
                  composer update --dry-run --with-all-dependencies --no-interaction
